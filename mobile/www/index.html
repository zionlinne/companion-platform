<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Deep Companion</title>
    <link rel="stylesheet" href="./setup.css" />
  </head>
  <body>
    <main>
      <p class="mark">D/</p>
      <h1>开发调试包</h1>
      <p>这一页只属于 debug 开发变体，用来给开发者选择本机服务。它不是内测成品。普通用户的安装包不会出现地址栏或供应商 Key。</p>
      <p class="muted">可分发内测包必须在构建时锁定真实 HTTPS 源。没有部署域名时不生成那个包。这里没有预置公网地址，也没有供应商 Key。推送没有接入。</p>
      <p class="muted" id="debug-note" hidden>这个 debug 包可以临时填写 <code>http://127.0.0.1:8787</code>。手机上的 127.0.0.1 是手机自己，必须先做 adb reverse。正式包不接受 HTTP。</p>
      <form class="panel">
        <label>服务源
          <input id="origin" name="origin" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://你的主机" />
        </label>
        <p class="error" id="error"></p>
        <button class="primary" type="submit">打开这个服务</button>
      </form>
      <div class="row">
        <button class="ghost" id="clear-cookies" type="button">清除本机 Cookie</button>
      </div>
      <p class="muted" id="version"></p>
    </main>
    <script type="module" src="./setup.js"></script>
  </body>
</html>
